template:
  name: nodejs-helloworld
  slug: nodejs-helloworld
  description: Singlepage Javascript Frontend
  category: web-app
  tags:
    - node
    - javascript
    - frontend
  base_image: node:24
  system_user: node
source:
  type: git
  url: $GITLAB_DOMAIN/launchpad/nodejs-helloworld.git
  branch: main
services:
  - name: web
    port: 3000
    command: npm start
    ingress:
      path_prefix: /
    workspace_path: default
init_stages:
  - stage: install
    steps:
      - name: install-dependencies
        command: npm install
  - stage: services
    steps:
      - name: setup-web
        command: echo "No build required"
